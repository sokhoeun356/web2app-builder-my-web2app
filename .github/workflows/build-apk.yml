name: Build Android APK Web2App Engine

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Clean Website URL'
        required: true
        default: 'https://google.com'
      app_name:
        description: 'Application Name'
        required: false
        default: 'x1One App'
      icon_url:
        description: 'App Icon Image URL'
        required: false
        default: ''
      bg_url:
        description: 'Splash/Background Image URL'
        required: false
        default: ''
      is_free:
        description: 'Has Company Banner'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ១. ស្វែងរក និងផ្ដល់សិទ្ធិឱ្យ gradlew
      - name: Prepare Gradlew Executable
        run: |
          find . -name "gradlew" -exec chmod +x {} +
          if [ ! -f "./gradlew" ]; then
            MAIN_GRADLEW=$(find . -name "gradlew" | head -n 1)
            [ -n "$MAIN_GRADLEW" ] && cp "$MAIN_GRADLEW" ./gradlew
          fi

      # ២. ប្តូររូប Logo App (បើមាន URL ផ្ញើមកពី Website)
      - name: Process Custom App Icon
        if: "${{ github.event.inputs.icon_url != '' }}"
        run: |
          # ស្វែងរក Folder mipmap ទាំងអស់ក្នុងគម្រោងដោយស្វ័យប្រវត្តិ
          MIPMAP_DIR=$(find . -type d -name "mipmap-xxxhdpi" | head -n 1)
          if [ -n "$MIPMAP_DIR" ]; then
            RES_DIR=$(dirname "$MIPMAP_DIR")
            curl -sL "${{ github.event.inputs.icon_url }}" -o /tmp/custom_icon.png || true
            for dir in "$RES_DIR"/mipmap-*; do
              cp /tmp/custom_icon.png "$dir/ic_launcher.png" 2>/dev/null || true
              cp /tmp/custom_icon.png "$dir/ic_launcher_round.png" 2>/dev/null || true
            done
          fi

      # ៣. បញ្ចូល Website URL ទៅក្នុងកូដ
      - name: Inject Website URL
        run: |
          find . -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i "s|https://example.com|${{ github.event.inputs.website_url }}|g" {} + 2>/dev/null || true

      # ៤. Compile APK តាម Task ដើម (ដំណើរការដូចកាលពី Run #8-#13 ដែលធ្លាប់ជោគជ័យ)
      - name: Execute Android Build
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assemble --no-daemon --stacktrace || ./gradlew build --no-daemon --stacktrace

      # ៥. បញ្ចេញឯកសារ APK គ្រប់ទីតាំងទាំងអស់
      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web2App-APK
          path: "**/*.apk"
          if-no-files-found: warn
