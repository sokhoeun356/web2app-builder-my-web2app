name: Build Android APK Web2App Engine

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Clean Website URL'
        required: true
        default: 'https://google.com'
      app_name:
        description: 'Application Name'
        required: false
        default: 'x1One App'
      icon_url:
        description: 'App Icon Image URL'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ទាញយក Logo មកជំនួសរូបមនុស្សយន្ត ដោយមិនឱ្យរាំងស្ទះដំណើរការ
      - name: Download & Replace Icon
        if: "${{ github.event.inputs.icon_url != '' }}"
        run: |
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          curl -sL "${{ github.event.inputs.icon_url }}" -o app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          curl -sL "${{ github.event.inputs.icon_url }}" -o app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          curl -sL "${{ github.event.inputs.icon_url }}" -o app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          curl -sL "${{ github.event.inputs.icon_url }}" -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

      # បញ្ចូល Website URL ទៅក្នុងកូដដើម
      - name: Inject Website URL
        run: |
          sed -i "s|https://example.com|${{ github.event.inputs.website_url }}|g" app/src/main/java/*/*/*/*.java 2>/dev/null || true
          sed -i "s|https://example.com|${{ github.event.inputs.website_url }}|g" app/src/main/java/*/*/*/*/*.java 2>/dev/null || true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # បង្កើត APK (បើ Release មិនដំណើរការ វានឹងប្តូរទៅ Debug ស្វ័យប្រវត្តិ)
      - name: Build Android APK
        run: |
          ./gradlew assembleRelease || ./gradlew assembleDebug

      # បញ្ចេញឯកសារ APK
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-finished
          path: app/build/outputs/apk/*/*/*.apk
