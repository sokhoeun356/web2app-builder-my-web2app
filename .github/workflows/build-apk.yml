name: Build Android APK Web2App Engine

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Clean Website URL'
        required: true
        default: 'https://google.com'
      app_name:
        description: 'Application Name'
        required: false
        default: 'x1One App'
      icon_url:
        description: 'App Icon Image URL'
        required: false
        default: ''
      bg_url:
        description: 'Splash/Background Image URL'
        required: false
        default: ''
      is_free:
        description: 'Has Company Banner'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ១. ជួសជុលសិទ្ធិ Gradlew
      - name: Fix Permissions
        run: chmod +x gradlew || true

      # ២. ទាញយករូប Logo (បើមាន)
      - name: Process Custom App Icon
        if: "${{ github.event.inputs.icon_url != '' }}"
        run: |
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          curl -sL "${{ github.event.inputs.icon_url }}" -o app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          curl -sL "${{ github.event.inputs.icon_url }}" -o app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          curl -sL "${{ github.event.inputs.icon_url }}" -o app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          curl -sL "${{ github.event.inputs.icon_url }}" -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png || true
          cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png || true

      # ៣. បញ្ចូល Website URL ទៅក្នុងកូដ
      - name: Inject Website URL
        run: |
          find app/src/main -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i "s|https://example.com|${{ github.event.inputs.website_url }}|g" {} + 2>/dev/null || true

      # ៤. Build APK ដោយបញ្ជាក់ Module :app (ដោះស្រាយបញ្ហា Task not found)
      - name: Execute Android Build
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      # ៥. បញ្ចេញឯកសារ APK
      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web2App-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: ignore
