name: Build Android APK Web2App Engine

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Clean Website URL'
        required: true
        default: 'https://x8ki-letl-twmt.n7.xano.io/api:x1one-web2app/app'
      app_name:
        description: 'Application Name'
        required: false
        default: 'x1One App'
      icon_url:
        description: 'App Icon Image URL'
        required: false
        default: ''
      bg_url:
        description: 'Splash/Background Image URL'
        required: false
        default: ''
      theme_mode:
        description: 'App Theme (dark or light)'
        required: false
        default: 'dark'
      is_free:
        description: 'Has Company Banner'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ១. ទទួលស្គាល់អាជ្ញាប័ណ្ណ Android SDK
      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # ២. បង្កើតរចនាសម្ព័ន្ធ Project Android
      - name: Scaffold Complete Android Project
        run: |
          mkdir -p app/src/main/java/com/x1one/web2app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          touch app/proguard-rules.pro

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=false
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Web2AppEngine"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.x1one.web2app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.x1one.web2app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "x1one_secure_pass"
                      keyAlias "x1one_alias"
                      keyPassword "x1one_secure_pass"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
                  debug {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Web2App"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#0D0D11</color>
              <color name="colorPrimaryDark">#000000</color>
              <color name="colorAccent">#84CC16</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.Web2App" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">#070B14</item>
                  <item name="android:windowTranslucentStatus">true</item>
                  <item name="android:windowTranslucentNavigation">true</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">x1One App</string>
          </resources>
          EOF

          # layout activity_main.xml (លាតធ្លាយពេញអេក្រង់ Fullscreen)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/mainRootLayout"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#070B14"
              android:fitsSystemWindows="false">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_above="@+id/bannerView" />

              <TextView
                  android:id="@+id/bannerView"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:background="#1E293B"
                  android:gravity="center"
                  android:padding="8dp"
                  android:text="Free Version • Powered by x1One"
                  android:textColor="#FFFFFF"
                  android:textSize="12sp"
                  android:visibility="gone" />

              <LinearLayout
                  android:id="@+id/layoutLoading"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:gravity="center"
                  android:background="#070B14"
                  android:visibility="visible">

                  <ProgressBar
                      android:id="@+id/progressBar"
                      android:layout_width="56dp"
                      android:layout_height="56dp"
                      android:indeterminate="true"
                      android:indeterminateTint="#84CC16" />

                  <TextView
                      android:id="@+id/txtLoading"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:text="Loading..."
                      android:textColor="#94A3B8"
                      android:textSize="14sp"
                      android:textStyle="bold" />
              </LinearLayout>
          </RelativeLayout>
          EOF

          # MainActivity.java (គ្រប់គ្រង Immersive Fullscreen និង Theme)
          cat << 'EOF' > app/src/main/java/com/x1one/web2app/MainActivity.java
          package com.x1one.web2app;

          import android.annotation.SuppressLint;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.LinearLayout;
          import android.widget.RelativeLayout;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private LinearLayout layoutLoading;
              private static final String APP_URL = "URL_INJECT_POINT";
              private static final boolean SHOW_BANNER = BANNER_INJECT_POINT;
              private static final String THEME_MODE = "THEME_INJECT_POINT";

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                      getWindow().setFlags(
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                      );
                  }

                  setContentView(R.layout.activity_main);

                  RelativeLayout mainRoot = findViewById(R.id.mainRootLayout);
                  webView = findViewById(R.id.webView);
                  layoutLoading = findViewById(R.id.layoutLoading);
                  TextView bannerView = findViewById(R.id.bannerView);
                  TextView txtLoading = findViewById(R.id.txtLoading);

                  if ("light".equalsIgnoreCase(THEME_MODE)) {
                      mainRoot.setBackgroundColor(Color.parseColor("#F1F5F9"));
                      layoutLoading.setBackgroundColor(Color.parseColor("#F1F5F9"));
                      txtLoading.setTextColor(Color.parseColor("#0F172A"));
                  } else {
                      mainRoot.setBackgroundColor(Color.parseColor("#070B14"));
                      layoutLoading.setBackgroundColor(Color.parseColor("#070B14"));
                      txtLoading.setTextColor(Color.parseColor("#94A3B8"));
                  }

                  if (SHOW_BANNER) {
                      bannerView.setVisibility(View.VISIBLE);
                  } else {
                      bannerView.setVisibility(View.GONE);
                  }

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                          layoutLoading.setVisibility(View.VISIBLE);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          layoutLoading.setVisibility(View.GONE);
                      }
                  });

                  webView.loadUrl(APP_URL);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      # ៣. បង្កើត Digital Keystore សម្រាប់ Release (បំបាត់ Alert Play Protect)
      - name: Create Production Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias x1one_alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass x1one_secure_pass \
            -keypass x1one_secure_pass \
            -dname "CN=x1One AI, OU=Development, O=x1One Web2App, L=Phnom Penh, ST=Phnom Penh, C=KH"

      # ៤. បញ្ចូល Parameters (URL, App Name, Banner, Theme)
      - name: Inject Custom Parameters
        run: |
          TARGET_URL="${{ github.event.inputs.website_url }}"
          [ -z "$TARGET_URL" ] && TARGET_URL="https://x8ki-letl-twmt.n7.xano.io/api:x1one-web2app/app"
          
          APP_NAME="${{ github.event.inputs.app_name }}"
          [ -z "$APP_NAME" ] && APP_NAME="x1One App"
          
          IS_FREE_VAL="${{ github.event.inputs.is_free }}"
          [ -z "$IS_FREE_VAL" ] && IS_FREE_VAL="true"

          THEME_VAL="${{ github.event.inputs.theme_mode }}"
          [ -z "$THEME_VAL" ] && THEME_VAL="dark"

          sed -i "s|URL_INJECT_POINT|$TARGET_URL|g" app/src/main/java/com/x1one/web2app/MainActivity.java
          sed -i "s|BANNER_INJECT_POINT|$IS_FREE_VAL|g" app/src/main/java/com/x1one/web2app/MainActivity.java
          sed -i "s|THEME_INJECT_POINT|$THEME_VAL|g" app/src/main/java/com/x1one/web2app/MainActivity.java
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" app/src/main/res/values/strings.xml

      # ៥. លុប Icon មនុស្សយន្តចាស់ និងជំនួសដោយរូប Logo x1One ផ្លូវការ ១០០%
      - name: Setup Official Custom App Icon
        run: |
          RAW_ICON="${{ github.event.inputs.icon_url }}"

          if echo "$RAW_ICON" | grep -q "base64,"; then
            echo "$RAW_ICON" | sed 's/^data:image\/[a-z]*;base64,//' | base64 -d > /tmp/custom_icon.png 2>/dev/null || true
          elif [ -n "$RAW_ICON" ] && echo "$RAW_ICON" | grep -q "^http"; then
            curl -sSL "$RAW_ICON" -o /tmp/custom_icon.png || true
          fi

          if [ ! -s /tmp/custom_icon.png ]; then
            UPLOADED_ICON=$(find . -maxdepth 2 -type f \( -name "*icon*.png" -o -name "*logo*.png" -o -name "app_icon.*" \) | head -n 1)
            [ -n "$UPLOADED_ICON" ] && cp "$UPLOADED_ICON" /tmp/custom_icon.png
          fi

          # បើគ្មានរូបទាញយក ប្រើប្រាស់ Logo x1One ផ្លូវការដោយផ្ទាល់
          if [ ! -s /tmp/custom_icon.png ]; then
            curl -sSL "https://images.rawpixel.com/image_png_800/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDI0LTAzL29yaWdpbmFsX3Bob3RvX2FydGlzdF9tYWtlcl9pY29uXzEwZDAzNDBiLTEwNGQtNGFhNC05MTZlLWFjZmIxYWFlOWY2YS5wbmc.png" -o /tmp/custom_icon.png || true
          fi

          # លុប Adaptive Vector ចាស់របស់ Android ចោលទាំងស្រុង មិនឱ្យចេញរូបមនុស្សយន្ត
          rm -rf app/src/main/res/mipmap-anydpi-v26
          rm -rf app/src/main/res/drawable/ic_launcher_background.xml
          rm -rf app/src/main/res/drawable-v24/ic_launcher_foreground.xml

          for dir in app/src/main/res/mipmap-*; do
            cp /tmp/custom_icon.png "$dir/ic_launcher.png"
            cp /tmp/custom_icon.png "$dir/ic_launcher_round.png"
          done

      # ៦. Compile Signed Release APK
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # ៧. បញ្ចេញឯកសារ APK ផ្លូវការ
      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web2App-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
