name: Build Android APK Web2App Engine

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Clean Website URL'
        required: true
        default: 'https://x8ki-letl-twmt.n7.xano.io/api:x1one-web2app/app'
      app_name:
        description: 'Application Name'
        required: false
        default: 'x1One App'
      icon_url:
        description: 'App Icon Image URL'
        required: false
        default: ''
      bg_url:
        description: 'Splash/Background Image URL'
        required: false
        default: ''
      is_free:
        description: 'Has Company Banner'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ១. ទទួលស្គាល់អាជ្ញាប័ណ្ណ Android SDK
      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # ២. ដំឡើងបរិស្ថាន Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ៣. បញ្ចូល Target URL របស់អ្នកទៅក្នុងកូដ
      - name: Inject Target URL
        run: |
          TARGET_URL="${{ github.event.inputs.website_url }}"
          [ -z "$TARGET_URL" ] && TARGET_URL="https://x8ki-letl-twmt.n7.xano.io/api:x1one-web2app/app"
          find . -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i "s|https://example.com|$TARGET_URL|g" {} + 2>/dev/null || true
          find . -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i "s|http://example.com|$TARGET_URL|g" {} + 2>/dev/null || true

      # ៤. កំណត់ឈ្មោះ App
      - name: Configure App Name
        run: |
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name">.*</string>|<string name="app_name">${{ github.event.inputs.app_name }}</string>|g' {} + 2>/dev/null || true

      # ៥. ទាញយក និងប្តូររូប Logo App (បើមាន URL)
      - name: Process Custom Icon
        if: "${{ github.event.inputs.icon_url != '' }}"
        run: |
          curl -sL "${{ github.event.inputs.icon_url }}" -o /tmp/logo.png || true
          find . -type d -name "res" | while read resdir; do
            for dir in "$resdir"/mipmap-*; do
              [ -d "$dir" ] && cp /tmp/logo.png "$dir/ic_launcher.png" 2>/dev/null || true
              [ -d "$dir" ] && cp /tmp/logo.png "$dir/ic_launcher_round.png" 2>/dev/null || true
            done
          done

      # ៦. រៀបចំ Settings ពេញលេញ និងដំណើរការ Build
      - name: Execute Android Build
        run: |
          # ប្រសិនបើគ្មាន settings.gradle យើងបង្កើត settings ពេញលេញដែលមាន Repository ត្រឹមត្រូវ
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "x1One-App"
          include ':app'
          EOF
          fi

          # បង្កើត Gradle Wrapper 8.2 ស្តង់ដារ
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

          # ដំណើរការ Assemble APK
          ./gradlew :app:assembleDebug --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace || ./gradlew assemble --no-daemon --stacktrace

      # ៧. បញ្ចេញឯកសារ APK
      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web2App-APK
          path: "**/*.apk"
          if-no-files-found: ignore
