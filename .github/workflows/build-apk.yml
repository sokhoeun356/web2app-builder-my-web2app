name: Build Android APK Web2App Engine

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Clean Website URL'
        required: true
        default: 'https://x8ki-letl-twmt.n7.xano.io/api:x1one-web2app/app'
      app_name:
        description: 'Application Name'
        required: false
        default: 'x1One App'
      icon_url:
        description: 'App Icon Image URL'
        required: false
        default: ''
      bg_url:
        description: 'Splash/Background Image URL'
        required: false
        default: ''
      is_free:
        description: 'Has Company Banner'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ១. បង្ហាញរចនាសម្ព័ន្ធឯកសារជាក់ស្តែងក្នុង Repository
      - name: Inspect Repository Structure
        run: |
          echo "=== ROOT DIRECTORY CONTENT ==="
          ls -la
          echo "=== SEARCHING BUILD FILES ==="
          find . -maxdepth 3 \( -name "build.gradle*" -o -name "settings.gradle*" -o -name "gradlew*" \)

      # ២. បញ្ចូល Target URL របស់អ្នកទៅក្នុងកូដដើម
      - name: Inject Target URL
        run: |
          TARGET_URL="${{ github.event.inputs.website_url }}"
          [ -z "$TARGET_URL" ] && TARGET_URL="https://x8ki-letl-twmt.n7.xano.io/api:x1one-web2app/app"
          find . -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i "s|https://example.com|$TARGET_URL|g" {} + 2>/dev/null || true
          find . -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i "s|http://example.com|$TARGET_URL|g" {} + 2>/dev/null || true

      # ៣. កំណត់ឈ្មោះ App
      - name: Configure App Name
        run: |
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name">.*</string>|<string name="app_name">${{ github.event.inputs.app_name }}</string>|g' {} + 2>/dev/null || true

      # ៤. រកទីតាំងពិតប្រាកដ រួច Compile ចេញពី Folder នោះផ្ទាល់
      - name: Execute Android Build
        run: |
          SETTINGS_PATH=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -n "$SETTINGS_PATH" ]; then
            TARGET_DIR=$(dirname "$SETTINGS_PATH")
            echo "Entering directory containing settings: $TARGET_DIR"
            cd "$TARGET_DIR"
          fi
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace || ./gradlew assemble --stacktrace
          else
            echo "No local gradlew, searching system gradle..."
            gradle assembleDebug --stacktrace || gradle assemble --stacktrace
          fi

      # ៥. បញ្ចេញឯកសារ APK
      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web2App-APK
          path: "**/*.apk"
          if-no-files-found: ignore
