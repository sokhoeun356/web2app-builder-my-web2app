name: Build Android APK Web2App Engine

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Clean Website URL'
        required: true
        default: 'https://x8ki-letl-twmt.n7.xano.io/api:x1one-web2app/app'
      app_name:
        description: 'Application Name'
        required: false
        default: 'x1One App'
      icon_url:
        description: 'App Icon Image URL'
        required: false
        default: ''
      bg_url:
        description: 'Splash/Background Image URL'
        required: false
        default: ''
      is_free:
        description: 'Has Company Banner'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ១. ផ្ដល់សិទ្ធិប្រតិបត្តិ gradlew
      - name: Grant Execute Permission
        run: chmod +x gradlew || true

      # ២. បញ្ចូល និងកំណត់ឱ្យស្គាល់ URL របស់អ្នកទៅគ្រប់ទីកន្លែងក្នុងគម្រោង Android
      - name: Inject Target Website URL
        run: |
          TARGET_URL="${{ github.event.inputs.website_url }}"
          [ -z "$TARGET_URL" ] && TARGET_URL="https://x8ki-letl-twmt.n7.xano.io/api:x1one-web2app/app"
          
          # ជំនួស URL នៅក្នុងឯកសារ Java និង Kotlin ទាំងអស់
          find app/src/main -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i "s|https://example.com|$TARGET_URL|g" {} + 2>/dev/null || true
          find app/src/main -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i "s|http://example.com|$TARGET_URL|g" {} + 2>/dev/null || true
          
          # ជំនួស URL នៅក្នុង strings.xml (ប្រសិនបើមាន tag website_url ឬ web_url)
          find app/src/main/res -name "strings.xml" -exec sed -i "s|https://example.com|$TARGET_URL|g" {} + 2>/dev/null || true

      # ៣. កំណត់ឈ្មោះ App
      - name: Configure App Name
        run: |
          find app/src/main/res -name "strings.xml" -exec sed -i 's|<string name="app_name">.*</string>|<string name="app_name">${{ github.event.inputs.app_name }}</string>|g' {} + 2>/dev/null || true

      # ៤. ប្តូររូប Logo App (បើមាន URL ផ្ញើមកពី Website)
      - name: Update App Logo
        if: "${{ github.event.inputs.icon_url != '' }}"
        run: |
          curl -sL "${{ github.event.inputs.icon_url }}" -o /tmp/logo.png || true
          find app/src/main/res -type d -name "mipmap-*" | while read dir; do
            cp /tmp/logo.png "$dir/ic_launcher.png" 2>/dev/null || true
            cp /tmp/logo.png "$dir/ic_launcher_round.png" 2>/dev/null || true
          done

      # ៥. កំណត់ Banner Free vs Paid
      - name: Configure Banner
        run: |
          if [ "${{ github.event.inputs.is_free }}" == "true" ]; then
            find app/src/main/res -name "*.xml" -exec sed -i 's|android:id="@+id/company_banner" android:visibility="gone"|android:id="@+id/company_banner" android:visibility="visible"|g' {} + 2>/dev/null || true
          else
            find app/src/main/res -name "*.xml" -exec sed -i 's|android:id="@+id/company_banner" android:visibility="visible"|android:id="@+id/company_banner" android:visibility="gone"|g' {} + 2>/dev/null || true
          fi

      # ៦. Compile APK
      - name: Execute Android Build
        run: |
          ./gradlew :app:assembleDebug --stacktrace || ./gradlew assembleDebug --stacktrace || ./gradlew assemble --stacktrace

      # ៧. Upload ឯកសារ APK
      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web2App-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: ignore

