name: Build Android APK Web2App Engine

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Clean Website URL'
        required: true
        default: 'https://x8ki-letl-twmt.n7.xano.io/api:x1one-web2app/app'
      app_name:
        description: 'Application Name'
        required: false
        default: 'x1One App'
      icon_url:
        description: 'App Icon Image URL'
        required: false
        default: ''
      bg_url:
        description: 'Splash/Background Image URL'
        required: false
        default: ''
      is_free:
        description: 'Has Company Banner'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ១. ទទួលស្គាល់អាជ្ញាប័ណ្ណ Android SDK
      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # ២. បង្កើតរចនាសម្ព័ន្ធ Project Android ពេញលេញ និងត្រឹមត្រូវតាមស្តង់ដារ Google
      - name: Scaffold Complete Android Project
        run: |
          mkdir -p app/src/main/java/com/x1one/web2app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi

          touch app/proguard-rules.pro

          # gradle.properties (ដោះស្រាយកង្វះ AndroidX និង Jetifier)
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=false
          EOF

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Web2AppEngine"
          include ':app'
          EOF

          # Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.x1one.web2app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.x1one.web2app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Web2App"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # values XML files
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#0D0D11</color>
              <color name="colorPrimaryDark">#000000</color>
              <color name="colorAccent">#0073E6</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.Web2App" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">#FFFFFF</item>
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">x1One App</string>
          </resources>
          EOF

          # activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_above="@+id/bannerView" />

              <TextView
                  android:id="@+id/bannerView"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:background="#222222"
                  android:gravity="center"
                  android:padding="8dp"
                  android:text="Free Version • Powered by x1One"
                  android:textColor="#FFFFFF"
                  android:textSize="12sp"
                  android:visibility="gone" />
          </RelativeLayout>
          EOF

          # MainActivity.java
          cat << 'EOF' > app/src/main/java/com/x1one/web2app/MainActivity.java
          package com.x1one.web2app;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private static final String APP_URL = "URL_INJECT_POINT";
              private static final boolean SHOW_BANNER = BANNER_INJECT_POINT;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  TextView bannerView = findViewById(R.id.bannerView);

                  if (SHOW_BANNER) {
                      bannerView.setVisibility(View.VISIBLE);
                  } else {
                      bannerView.setVisibility(View.GONE);
                  }

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl(APP_URL);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      # ៣. បញ្ចូល Target URL, App Name, និង Banner Logic
      - name: Inject Custom Parameters
        run: |
          TARGET_URL="${{ github.event.inputs.website_url }}"
          [ -z "$TARGET_URL" ] && TARGET_URL="https://x8ki-letl-twmt.n7.xano.io/api:x1one-web2app/app"
          
          APP_NAME="${{ github.event.inputs.app_name }}"
          [ -z "$APP_NAME" ] && APP_NAME="x1One App"
          
          IS_FREE_VAL="${{ github.event.inputs.is_free }}"
          [ -z "$IS_FREE_VAL" ] && IS_FREE_VAL="true"

          sed -i "s|URL_INJECT_POINT|$TARGET_URL|g" app/src/main/java/com/x1one/web2app/MainActivity.java
          sed -i "s|BANNER_INJECT_POINT|$IS_FREE_VAL|g" app/src/main/java/com/x1one/web2app/MainActivity.java
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" app/src/main/res/values/strings.xml

      # ៤. រៀបចំរូបតំណាង Icon x1One
      - name: Setup App Icon
        run: |
          # ទាញយករូប Icon បើមានបញ្ចូល ឬប្រើ Icon ស្វ័យប្រវត្តិ
          ICON_URL="${{ github.event.inputs.icon_url }}"
          if [ -n "$ICON_URL" ]; then
            curl -sL "$ICON_URL" -o /tmp/downloaded_icon.png || true
          fi

          if [ ! -s /tmp/downloaded_icon.png ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > /tmp/downloaded_icon.png
          fi

          for dir in app/src/main/res/mipmap-*; do
            cp /tmp/downloaded_icon.png "$dir/ic_launcher.png" 2>/dev/null || true
          done

      # ៥. ដំឡើង Gradle និងដំណើរការ Assemble APK
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # ៦. បញ្ចេញឯកសារ APK
      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web2App-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
