name: Build Android APK Web2App Engine

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Clean Website URL'
        required: true
        default: 'https://x8ki-letl-twmt.n7.xano.io/api:x1one-web2app/app'
      app_name:
        description: 'Application Name'
        required: false
        default: 'x1One App'
      icon_url:
        description: 'App Icon Image URL'
        required: false
        default: ''
      bg_url:
        description: 'Splash/Background Image URL'
        required: false
        default: ''
      is_free:
        description: 'Has Company Banner'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ១. ទទួលស្គាល់អាជ្ញាប័ណ្ណ Android
      - name: Accept Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # ២. បញ្ចូល Target URL របស់អ្នកទៅក្នុងកូដដើម
      - name: Inject Target URL
        run: |
          TARGET_URL="${{ github.event.inputs.website_url }}"
          [ -z "$TARGET_URL" ] && TARGET_URL="https://x8ki-letl-twmt.n7.xano.io/api:x1one-web2app/app"
          find . -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i "s|https://example.com|$TARGET_URL|g" {} + 2>/dev/null || true

      # ៣. ស្វែងរកទីតាំង gradlew រួច Build ចេញជា APK ផ្ទាល់
      - name: Execute Android Build
        run: |
          # ស្វែងរកទីតាំង gradlew ក្នុង repository
          GW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GW_PATH" ]; then
            cd "$(dirname "$GW_PATH")"
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon || ./gradlew assemble --no-daemon
          else
            chmod +x gradlew 2>/dev/null || true
            ./gradlew assembleDebug --no-daemon || ./gradlew assemble --no-daemon
          fi

      # ៤. បញ្ចេញឯកសារ APK
      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web2App-APK
          path: "**/*.apk"
          if-no-files-found: ignore
