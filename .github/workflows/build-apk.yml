name: x1One Ai Web2app - Build APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "Website URL to load inside the APK"
        required: true
        default: "https://example.com"
        type: string

      app_name:
        description: "Application name"
        required: true
        default: "x1One Ai Web2app"
        type: string

      package_name:
        description: "Android package name"
        required: true
        default: "com.x1oneai.web2app"
        type: string

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check inputs
        shell: bash
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -e

          if [[ ! "$WEBSITE_URL" =~ ^https?:// ]]; then
            echo "ERROR: Website URL must start with http:// or https://"
            exit 1
          fi

          if [[ ! "$PACKAGE_NAME" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "ERROR: Invalid Android package name."
            echo "Example: com.x1oneai.web2app"
            exit 1
          fi

          if [ -z "$APP_NAME" ]; then
            echo "ERROR: App name cannot be empty."
            exit 1
          fi

          echo "Website URL: $WEBSITE_URL"
          echo "App Name: $APP_NAME"
          echo "Package Name: $PACKAGE_NAME"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        shell: bash
        run: |
          curl -L \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Create Android project
        shell: bash
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -e
          python3 - << 'PY'
          import os
          import sys

          package_name = os.environ.get("PACKAGE_NAME", "com.x1oneai.web2app")
          app_name = os.environ.get("APP_NAME", "x1One Ai Web2app")
          url = os.environ.get("WEBSITE_URL", "https://example.com")

          os.makedirs("android-app/app/src/main/res/values", exist_ok=True)
          os.makedirs("android-app/gradle/wrapper", exist_ok=True)

          settings_gradle = 'rootProject.name = "Web2App"\ninclude(":app")\n'
          with open("android-app/settings.gradle", "w", encoding="utf-8") as f:
              f.write(settings_gradle)

          root_build_gradle = """
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.5.2")
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          """
          with open("android-app/build.gradle", "w", encoding="utf-8") as f:
              f.write(root_build_gradle.strip() + "\n")

          app_build_gradle = f"""
          plugins {{
              id("com.android.application")
          }}

          android {{
              namespace "{package_name}"
              compileSdk 35

              defaultConfig {{
                  applicationId "{package_name}"
                  minSdk 21
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }}

              buildTypes {{
                  release {{
                      minifyEnabled false
                  }}
                  debug {{
                      debuggable true
                  }}
              }}

              compileOptions {{
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }}
          }}

          dependencies {{
              implementation("androidx.appcompat:appcompat:1.7.0")
          }}
          """
          with open("android-app/app/build.gradle", "w", encoding="utf-8") as f:
              f.write(app_build_gradle.strip() + "\n")

          manifest = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """
          with open("android-app/app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(manifest.strip() + "\n")

          strings_xml = f"""<resources>
              <string name="app_name">{app_name}</string>
          </resources>
          """
          with open("android-app/app/src/main/res/values/strings.xml", "w", encoding="utf-8") as f:
              f.write(strings_xml.strip() + "\n")

          pkg_path = package_name.replace(".", "/")
          java_dir = os.path.join("android-app/app/src/main/java", pkg_path)
          os.makedirs(java_dir, exist_ok=True)

          java_code = f"""package {package_name};

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {{
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("{url}");
              }}

              @Override
              public void onBackPressed() {{
                  if (webView != null && webView.canGoBack()) {{
                      webView.goBack();
                  }} else {{
                      super.onBackPressed();
                  }}
              }}
          }}
          """
          with open(os.path.join(java_dir, "MainActivity.java"), "w", encoding="utf-8") as f:
              f.write(java_code.strip() + "\n")

          print("Android project created successfully.")
          PY

      - name: Build Debug APK
        working-directory: android-app
        shell: bash
        run: |
          set -e
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          set -e
          mkdir -p output
          cp \
            android-app/app/build/outputs/apk/debug/app-debug.apk \
            "output/x1One-Ai-Web2app-debug.apk"
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: x1One-Ai-Web2app-APK
          path: output/x1One-Ai-Web2app-debug.apk
          retention-days: 7
