name: Build Android APK Web2App Engine

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Clean Website URL'
        required: true
        default: 'https://x8ki-letl-twmt.n7.xano.io/api:x1one-web2app/app'
      app_name:
        description: 'Application Name'
        required: false
        default: 'x1One App'
      icon_url:
        description: 'App Icon Image URL'
        required: false
        default: ''
      bg_url:
        description: 'Splash/Background Image URL'
        required: false
        default: ''
      is_free:
        description: 'Has Company Banner'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ១. ទទួលស្គាល់អាជ្ញាប័ណ្ណ Android SDK (ដោះស្រាយ Exit Code 1)
      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # ២. រៀបចំគ្រោងគម្រោង Native Web2App ពេញលេញ
      - name: Scaffold Complete Android Project
        run: |
          mkdir -p app/src/main/java/com/x1one/web2app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Web2AppEngine"
          include ':app'
          EOF

          # Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.x1one.web2app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.x1one.web2app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_app_logo"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_app_logo"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Web2App"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # styles.xml & strings.xml
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.Web2App" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">x1One App</string>
          </resources>
          EOF

          # Default Vector Logo
          cat << 'EOF' > app/src/main/res/drawable/ic_app_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#3DDC84"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          # activity_main.xml (មាន WebView និង Banner)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_above="@+id/bannerView" />

              <TextView
                  android:id="@+id/bannerView"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:background="#222222"
                  android:gravity="center"
                  android:padding="8dp"
                  android:text="Free Version • Powered by x1One"
                  android:textColor="#FFFFFF"
                  android:textSize="12sp"
                  android:visibility="gone" />
          </RelativeLayout>
          EOF

          # MainActivity.java
          cat << 'EOF' > app/src/main/java/com/x1one/web2app/MainActivity.java
          package com.x1one.web2app;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private static final String DEFAULT_URL = "TARGET_URL_PLACEHOLDER";
              private static final boolean IS_FREE = BANNER_BOOLEAN_PLACEHOLDER;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  TextView bannerView = findViewById(R.id.bannerView);

                  if (IS_FREE) {
                      bannerView.setVisibility(View.VISIBLE);
                  } else {
                      bannerView.setVisibility(View.GONE);
                  }

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl(DEFAULT_URL);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      # ៣. បញ្ចូលទិន្នន័យថ្មីដែលអ្នកចង់បន្ថែម (Target URL, App Name, Banner Free/Paid)
      - name: Inject Custom Parameters
        run: |
          TARGET_URL="${{ github.event.inputs.website_url }}"
          [ -z "$TARGET_URL" ] && TARGET_URL="https://x8ki-letl-twmt.n7.xano.io/api:x1one-web2app/app"
          
          APP_NAME="${{ github.event.inputs.app_name }}"
          [ -z "$APP_NAME" ] && APP_NAME="x1One App"
          
          IS_FREE_VAL="${{ github.event.inputs.is_free }}"
          [ -z "$IS_FREE_VAL" ] && IS_FREE_VAL="true"

          # ជំនួស URL ទៅក្នុងកូដ Java
          sed -i "s|TARGET_URL_PLACEHOLDER|$TARGET_URL|g" app/src/main/java/com/x1one/web2app/MainActivity.java
          
          # ជំនួស Banner (true/false)
          sed -i "s|BANNER_BOOLEAN_PLACEHOLDER|$IS_FREE_VAL|g" app/src/main/java/com/x1one/web2app/MainActivity.java
          
          # ជំនួស App Name ទៅក្នុង strings.xml
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" app/src/main/res/values/strings.xml

      # ៤. ទាញយករូបភាព Icon ថ្មី (បើមានបញ្ចូល URL)
      - name: Process Custom Icon
        if: "${{ github.event.inputs.icon_url != '' }}"
        run: |
          curl -sL "${{ github.event.inputs.icon_url }}" -o app/src/main/res/drawable/ic_app_logo.png || true

      # ៥. ដំឡើង Gradle និងដំណើរការ Assemble APK
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ៦. បញ្ចេញឯកសារ APK ជាផ្លូវការ
      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web2App-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
